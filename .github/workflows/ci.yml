name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Validate repository
        run: uv run holo-polymarket-validate

      - name: Validate plugin sync
        run: uv run holo-polymarket-sync-plugin --check

      - name: Prepare test temp directory
        run: mkdir -p .tmp

      - name: Run Python tests
        run: uv run python -m pytest --basetemp .tmp/pytest -p no:cacheprovider

      - name: Run Bash skill tests (offline)
        run: bash tests/run_tests.sh
