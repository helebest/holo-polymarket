name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Verify tag format and match project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strict vX.Y.Z validation before the value is used anywhere.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' must be a vX.Y.Z release tag"
            exit 1
          fi
          ver="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG  pyproject=$ver"
          if [ "${TAG#v}" != "$ver" ]; then
            echo "::error::tag $TAG does not match pyproject version $ver (keep versions in lockstep)"
            exit 1
          fi

      - name: Repository invariants
        run: |
          uv run holo-polymarket-validate
          uv run holo-polymarket-sync-plugin --check

      - name: Build release artifacts
        run: uv run holo-polymarket-build

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## " v {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md." > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            dist/skills/*.zip \
            dist/plugins/*.zip \
            dist/checksums.txt
